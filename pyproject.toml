[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pizza-ab"
version = "1.0.0"
description = "End-to-end A/B test case study for a pizza delivery app: power analysis, analysis, peeking, novelty, segment reversal, and a ship decision."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "nbconvert", "jupytext", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
